basePath: /api/v1
definitions:
  config.Credentials:
    properties:
      apikey:
        type: string
      password:
        type: string
      secret:
        type: string
      username:
        type: string
    type: object
  config.DataSource:
    properties:
      creds:
        additionalProperties:
          $ref: '#/definitions/config.Credentials'
        type: object
      name:
        type: string
      options:
        additionalProperties:
          type: integer
        description: |-
          Options holds source-specific integer settings, such as a credit
          budget, read by the source's plugin through IntOption. Prospeo reads
          max_emails_per_domain and min_remaining_credits.
        type: object
      ttl:
        type: integer
    type: object
  config.DataSourceConfig:
    properties:
      datasources:
        items:
          $ref: '#/definitions/config.DataSource'
        type: array
      global_options:
        additionalProperties:
          type: integer
        type: object
    type: object
  config.Database:
    properties:
      db_name:
        description: Name of the database
        type: string
      host:
        description: Host of the database
        type: string
      options:
        description: Extra options used while connecting to the database
        type: string
      password:
        description: Password for authentication
        type: string
      port:
        description: Port of the database
        type: string
      primary:
        description: Whether this database is the primary store
        type: boolean
      system:
        description: Database system type (Postgres, MySQL, etc.)
        type: string
      url:
        description: Full URI to the database
        type: string
      username:
        description: Username for authentication
        type: string
    type: object
  config.Scope:
    properties:
      asns:
        description: ASNs specified as in scope
        items:
          type: integer
        type: array
      blacklist:
        description: A blacklist of subdomain names that will not be investigated
        items:
          type: string
        type: array
      cidrs:
        description: |-
          CIDRs in scope. In JSON each is Go's net.IPNet encoding, an object
          such as {"IP": "198.51.100.0", "Mask": "////AA=="}, where Mask is the
          base64 of the mask bytes; a plain "198.51.100.0/24" string is rejected
        items:
          type: object
        type: array
      domains:
        description: The root domain names that the enumeration will target
        items:
          type: string
        type: array
      ips:
        description: IP addresses in scope, as strings such as "192.0.2.10" or "2001:db8::1"
        items:
          type: string
        type: array
      ports:
        description: The ports scanned and probed in active mode, as a list of integers
        items:
          type: integer
        type: array
    type: object
  config.Transformation:
    properties:
      confidence:
        type: integer
      exclude:
        items:
          type: string
        type: array
      priority:
        type: integer
      ttl:
        type: integer
    type: object
  github_com_owasp-amass_amass_v5_config.Config:
    properties:
      active:
        description: |-
          Enables active probing of target hosts: port scans, HTTP/HTTPS service
          probes, banner and TLS certificate probes, and JARM fingerprinting
        type: boolean
      active_proxy:
        description: |-
          ActiveProxy is the runtime proxy URL through which all -active traffic
          (port scans, HTTP/HTTPS probes, banner and TLS certificate probes, and
          JARM) must egress. Passive traffic (data sources, registry lookups) and
          all DNS are unaffected and continue to use the default networking path.
          Supported schemes: http, https, socks5, socks5h.
        type: string
      active_strict:
        description: |-
          ActiveStrict, when true (the default), makes the engine refuse to start
          an active run that has no ActiveProxy configured, so active traffic
          cannot egress out of the default network by accident. Set it to false
          to allow active traffic over the default egress (for testing, or for a
          target that can be probed without the proxy). When an ActiveProxy IS
          configured, all active traffic goes through it regardless of this flag.
        type: boolean
      alt_worldlist:
        items:
          type: string
        type: array
      alterations:
        description: Will discovered subdomain name alterations be generated?
        type: boolean
      brute_force:
        description: Will the enumeration including brute forcing techniques
        type: boolean
      database:
        description: The graph databases used by the system / enumerations
        items:
          $ref: '#/definitions/config.Database'
        type: array
      datasource_config:
        allOf:
        - $ref: '#/definitions/config.DataSourceConfig'
        description: The data source configurations
      resolvers:
        description: Resolver settings
        items:
          type: string
        type: array
      rigid_boundaries:
        description: Determines rigidness of the enumeration
        type: boolean
      scope_vetoes:
        description: 'ScopeVetoes controls the engine''s scope-expansion vetoes:
          "enforce" (the default, also used when empty) declines scope additions
          that the evidence says belong to someone else; "observe" logs each veto
          as "would decline" and keeps the previous behavior; "off" skips them.
          Every decision is logged as "scope decision".'
        type: string
      scope:
        allOf:
        - $ref: '#/definitions/config.Scope'
        description: Scope struct that contains ASN, CIDR, Domain, IP, and ports in
          scope
      seed:
        allOf:
        - $ref: '#/definitions/config.Scope'
        description: Seed struct that contains the provided names and CIDRs
      transformations:
        additionalProperties:
          $ref: '#/definitions/config.Transformation'
        description: The Transformations map will contain incoming assets, and what
          handlers should be called.
        type: object
      trusted_resolvers:
        items:
          type: string
        type: array
      wordlist:
        description: The list of words to use when generating names
        items:
          type: string
        type: array
    type: object
  support.EndWorkProgress:
    properties:
      candidates:
        type: integer
      done:
        type: boolean
      leased:
        type: integer
      phase:
        type: string
      processed:
        type: integer
      requeued:
        type: integer
      waiting:
        type: integer
    type: object
  v1.AddAssetResponse:
    properties:
      entityID:
        type: string
    type: object
  v1.BacklogBucket:
    properties:
      asset_type:
        type: string
      leased:
        type: integer
      processed:
        type: integer
      queue:
        type: integer
      waiting:
        type: integer
    type: object
  v1.BacklogResponse:
    properties:
      active_connections:
        type: integer
      active_scan_conns:
        type: integer
      buckets:
        items:
          $ref: '#/definitions/v1.BacklogBucket'
        type: array
      max_connections:
        type: integer
      max_scan_conns:
        type: integer
      prefilter_open:
        type: integer
      prefilter_scanned:
        type: integer
    type: object
  v1.BulkAddAssetsRequest:
    properties:
      items:
        items:
          items:
            format: int32
            type: integer
          type: array
        type: array
    type: object
  v1.BulkAddAssetsResponse:
    properties:
      failed:
        type: integer
      ingested:
        type: integer
      stored:
        type: integer
    type: object
  v1.CreateSessionResponse:
    properties:
      sessionToken:
        type: string
    type: object
  v1.ErrorResponse:
    properties:
      code:
        type: integer
      details:
        type: string
      error:
        type: string
    type: object
  v1.HandlerStat:
    properties:
      avg_duration_ns:
        type: number
      call_count:
        type: integer
      handler:
        type: string
    type: object
  v1.HandlerStatsResponse:
    properties:
      handlers:
        items:
          $ref: '#/definitions/v1.HandlerStat'
        type: array
      window_minutes:
        type: integer
    type: object
  v1.HealthCheckResponse:
    properties:
      result:
        type: string
    type: object
  v1.ListSessionsResponse:
    properties:
      sessionTokens:
        items:
          type: string
        type: array
    type: object
  v1.ScopeResponse:
    properties:
      data:
        items:
          items:
            format: int32
            type: integer
          type: array
        type: array
    type: object
  v1.SessionStatsResponse:
    properties:
      workItemsCompleted:
        type: integer
      workItemsTotal:
        type: integer
    type: object
info:
  contact:
    name: OWASP Amass Project
    url: https://github.com/owasp-amass/amass
  description: |-
    HTTP API for managing Amass Engine sessions and submitting Open Asset Model (OAM) assets.
    Create a session with an engine config, query session stats/scope, and ingest typed OAM assets (single or bulk).
    Includes a WebSocket endpoint for streaming session logs.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  termsOfService: https://owasp.org/www-project-amass/
  title: Amass Engine API (v1)
  version: "1.0"
paths:
  /handler-stats:
    get:
      description: Queries InfluxDB for the handler_duration measurement written by
        the engine's pipeline task wrapper, returning average duration and call count
        per handler over the last 15 minutes, sorted slowest first. Not session-scoped
        - see the note above GetBacklogHandler for why. Returns 503 if INFLUX_* environment
        variables are not configured.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.HandlerStatsResponse'
        "503":
          description: InfluxDB not configured or unreachable
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get per-handler average execution time
      tags:
      - telemetry
  /health:
    get:
      description: Returns a simple health indicator that the Amass Engine API is
        running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.HealthCheckResponse'
      summary: Health check
      tags:
      - system
  /sessions:
    post:
      consumes:
      - application/json
      description: Creates a new Amass engine session using the provided configuration
        JSON. The configuration must include scope. The session does no work until
        seed assets are posted to /sessions/{session_token}/assets, and its handlers
        run only for the transformations in the configuration. With active set to
        true, the request is refused with 400 when no active_proxy is configured and
        active_strict is not false, and with 500 when the active_proxy cannot be reached
        or will not relay; the reason is in details.
      parameters:
      - description: Engine configuration
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/github_com_owasp-amass_amass_v5_config.Config'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/v1.CreateSessionResponse'
        "400":
          description: Invalid JSON, or invalid configuration (including a missing
            scope and the active-egress policy)
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Failed to create session (including an unusable active_proxy)
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Create a new engine session
      tags:
      - sessions
  /sessions/{session_token}:
    delete:
      description: Stops the session immediately and returns 204. The token is invalid
        from that point. Cleanup (backlog, temporary directory, database connection)
        finishes in the background about 10 seconds later.
      parameters:
      - description: Session token (UUID)
        in: path
        name: session_token
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid session token
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Terminate a session
      tags:
      - sessions
  /sessions/{session_token}/assets/{asset_type}:
    post:
      consumes:
      - application/json
      description: Submits a single OAM asset to the session. The asset type is provided
        in the URL path; the request body is a raw OAM JSON object without a 'type'
        field.
      parameters:
      - description: Session token (UUID)
        in: path
        name: session_token
        required: true
        type: string
      - description: 'Asset type: the Open Asset Model type name in lowercase with
          no separators (e.g., fqdn, ipaddress, netblock, autonomoussystem, organization)'
        in: path
        name: asset_type
        required: true
        type: string
      - description: Raw OAM JSON object (without 'type')
        in: body
        name: asset
        required: true
        schema:
          items:
            format: int32
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.AddAssetResponse'
        "400":
          description: Invalid session token, invalid JSON, or invalid asset object
            (unknown type, or no identifying value such as an FQDN without a name)
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Failed to submit the asset; the database's reason is in details
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Add a single asset (typed by path)
      tags:
      - assets
  /sessions/{session_token}/assets/{asset_type}:bulk:
    post:
      consumes:
      - application/json
      description: Submits multiple OAM assets to the session in one request. The
        asset type is provided in the URL path. Each item in 'items' is a raw OAM
        JSON object without a 'type' field. Items that do not parse, or have no identifying
        value, are skipped and not counted; items the database refuses are counted
        in failed.
      parameters:
      - description: Session token (UUID)
        in: path
        name: session_token
        required: true
        type: string
      - description: 'Asset type: the Open Asset Model type name in lowercase with
          no separators (e.g., fqdn, ipaddress, netblock, autonomoussystem, organization)'
        in: path
        name: asset_type
        required: true
        type: string
      - description: Bulk add request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.BulkAddAssetsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.BulkAddAssetsResponse'
        "400":
          description: Invalid session token, invalid JSON, empty items, or no valid
            items
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "413":
          description: Too many items in bulk request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "500":
          description: Server failure (response includes ingested/stored/failed)
          schema:
            $ref: '#/definitions/v1.BulkAddAssetsResponse'
      summary: Add assets in bulk (typed by path)
      tags:
      - assets
  /sessions/{session_token}/backlog:
    get:
      description: 'Returns, for each asset type with any activity, the number of
        entities waiting, currently leased (in flight), sitting in the pipeline''s
        own internal queue, and already processed - plus session-wide connection semaphore
        utilization and cumulative port_prefilter statistics. Development/testing
        tooling: PrefilterScanned/PrefilterOpen use plain, session-independent counters
        (see support.PrefilterStats), correct for this fork''s one-session-per-process
        deployment model but not intended for use in a multi-session or long-lived-process
        deployment.'
      parameters:
      - description: Session token (UUID)
        in: path
        name: session_token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.BacklogResponse'
        "400":
          description: Invalid session token
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get per-asset-type backlog counts for a session
      tags:
      - sessions
  /sessions/{session_token}/end-work:
    get:
      description: Reports the progress of the work started by POST /sessions/{session_token}/end-work.
        done becomes true when that work has finished, and stays false if it was never
        started. phase is one of none, owned-fill, idle-wait, listing, requeue, drain
        or done. candidates and requeued are the sweep's counts; waiting, leased and
        processed are the IPAddress backlog counts.
      parameters:
      - description: Session token (UUID)
        in: path
        name: session_token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/support.EndWorkProgress'
        "400":
          description: Invalid session token
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get session-end work progress
      tags:
      - sessions
    post:
      description: 'Starts the session-end work in the background: the owned-netblock
        fill, then the Protocol-Probes sweep of IPs that were missed. Both run only
        when the session has active set to true; otherwise the work finishes at once.
        Only the first request for a session starts the work; later requests return
        202 and do nothing. The session keeps running, so stats and end-work progress
        stay available. Poll GET /sessions/{session_token}/end-work until done is
        true.'
      parameters:
      - description: Session token (UUID)
        in: path
        name: session_token
        required: true
        type: string
      responses:
        "202":
          description: Accepted; the work runs in the background
        "400":
          description: Invalid session token
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Start session-end work
      tags:
      - sessions
  /sessions/{session_token}/scope/{asset_type}:
    get:
      description: Returns the scoped assets for the given session and asset type
        as an array of raw OAM JSON objects.
      parameters:
      - description: Session token (UUID)
        in: path
        name: session_token
        required: true
        type: string
      - description: 'Asset type: autonomoussystem, fqdn, ipaddress, netblock, location
          or organization'
        in: path
        name: asset_type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Response contains a 'data' array of raw OAM JSON
          schema:
            $ref: '#/definitions/v1.ScopeResponse'
        "400":
          description: Invalid session token
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Session not found or scope not found for asset type
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get session scope for an asset type
      tags:
      - scope
  /sessions/{session_token}/stats:
    get:
      description: 'Returns the session''s work-item counts, recalculated every 2
        seconds from the backlog across all asset types: workItemsCompleted is the
        number processed, workItemsTotal is processed plus waiting plus leased. The
        session is idle when the two are equal.'
      parameters:
      - description: Session token (UUID)
        in: path
        name: session_token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.SessionStatsResponse'
        "400":
          description: Invalid session token
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Get session statistics
      tags:
      - sessions
  /sessions/{session_token}/ws/logs:
    get:
      description: Upgrades the HTTP connection to a WebSocket and streams the session's
        log records as UTF-8 text frames, one JSON object per frame, in order. Only
        records written while the client is connected are delivered; nothing is buffered
        for later. The server sends a ping every 30 seconds and drops a client that
        has not answered within 60 seconds, so a client must keep reading the connection
        (which answers the pings). Messages the client sends are ignored. When the
        session ends, the server sends a close frame.
      parameters:
      - description: Session token (UUID)
        in: path
        name: session_token
        required: true
        type: string
      responses:
        "101":
          description: Switching Protocols (WebSocket upgrade)
          headers:
            Connection:
              description: Upgrade
              type: string
            Upgrade:
              description: websocket
              type: string
        "400":
          description: Invalid session token
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
        "404":
          description: Session not found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Stream session logs (WebSocket)
      tags:
      - sessions
  /sessions/list:
    get:
      description: Returns the session tokens for all currently active sessions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.ListSessionsResponse'
        "404":
          description: Zero sessions found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: List active sessions
      tags:
      - sessions
swagger: "2.0"
tags:
- description: System endpoints (health, etc.)
  name: system
- description: Create, list, inspect, and terminate engine sessions.
  name: sessions
- description: Read-only access to the scoped assets loaded into a session.
  name: scope
- description: Submit typed OAM assets to a session (single or bulk).
  name: assets
- description: WebSocket endpoints (e.g., session log streaming).
  name: ws
