#  blacklist: # subdomains to be blacklisted
#    - example.owasp.org
options:
  datasources: "./datasources.yaml"
  engine: "http://engine:4000"
  # be sure to set your username and password in the following URI to the 
  # AMASS_USER and AMASS_PASSWORD values, respectively, in your .env file
  # database: "bolt://neo4j:amass4OWASP@neo4j:7687/neo4j"
  database: "postgres://amass:CHANGE_ME@192.168.1.125:5432/assetdb"
  bruteforce:
    enabled: false
    wordlists: # wordlist(s) to use that are specific to brute forcing
      - "./wordlists/short-wordlist.txt"
      #- "./wordlists/subdomains-top1mil-5000.txt"
      #- "./wordlists/subdomains-top1mil-20000.txt"
      #- "./wordlists/subdomains-top1mil-110000.txt"
  alterations:
    enabled: false
    wordlists: # wordlist(s) to use that are specific to name alterations
      - "./wordlists/alterations.txt"
  default_transform_values:
    ttl: 10800 # minutes. If not specified, the default is 1440 minutes (1 day)
    confidence: 50 # 50%
    priority: 5

transformations:
  Account->ALL:
    ttl: 10800 # 7 days
  AutnumRecord->ALL:
  AutonomousSystem->ALL:
  AutonomousSystem->RDAP:
    ttl: 43200 # 30 days
  ContactRecord->ALL:
  DomainRecord->ALL:
  File->ALL:
  FQDN->ALL:
  FQDN->DomainRecord:
    ttl: 43200 # 30 days
  FundsTransfer->ALL:
    ttl: 10800 # 7 days
  Identifier->ALL:
  Identifier->GLEIF:
    ttl: 43200 # 30 days
  Identifier->RDAP:
    ttl: 43200 # 30 days
  IPAddress->ALL:
  IPAddress->Port-Prefilter:
  IPNetRecord->ALL:
  Location->ALL:
    confidence: 80
  Netblock->ALL:
  Netblock->RDAP:
    ttl: 43200 # 30 days
  Organization->ALL:
  Organization->GLEIF:
    ttl: 43200 # 30 days
  Person->ALL:
    ttl: 43200 # 30 days
  Phone->ALL:
    ttl: 10800 # 7 days
  Product->ALL:
    ttl: 10800 # 7 days
  ProductRelease->ALL:
  Service->ALL:
  TLSCertificate->ALL:
    ttl: 10800 # 7 days
  URL->ALL:
