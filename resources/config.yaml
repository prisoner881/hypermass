scope:
#  domains: # registered domain names in scope
#    - owasp.org
#  ips: # IP addresses in scope, multiple methods of inserting IP addresses can be used
#    - 192.0.2.1
#    - 192.0.2.2
#    - 192.168.0.3-8
#    - 192.168.0.10-192.168.0.20
#  cidrs: # CIDR ranges that are in scope
#    - 192.0.2.0/24
#    - 192.0.2.128/25
  ports: # ports to be used when actively scanning services
    - 80
    - 443
    - 8000
    - 8080
    - 8443
    - 8888
#  blacklist: # subdomains to be blacklisted
#    - example.owasp.org
options:
  datasources: "./datasources.yaml"
  # engine: "http://127.0.0.1:4000"
  # database: "bolt://neo4j:amass4OWASP@neo4j:7687/neo4j"
  # database: "postgres://amass:amass4OWASP@assetdb:5432/assetdb"
  # Active egress. All traffic generated by -active (HTTP probes, raw TLS /
  # JARM dials, port connect scans) is routed through this proxy. Passive
  # OSINT / data-source / crawl traffic and all DNS are unaffected and keep
  # using the default network. Supported schemes: http, https, socks5, socks5h.
  # active_proxy: "socks5://127.0.0.1:1080"
  # When true (the default), an active run with no active_proxy is refused so
  # active traffic cannot leave the default network by accident. Set false to
  # allow active traffic over the default egress (testing, or a target that
  # does not need the proxy). When an active_proxy IS set, all active traffic
  # goes through it regardless of this flag. The proxy is checked when the
  # session starts; a run is refused if it is down.
  # active_strict: true
  # Scope-expansion vetoes: what the engine does with evidence that an asset
  # about to join the scope belongs to someone else (a netblock a target name
  # merely resolves into, a netblock or ASN registered to another
  # organization, a certificate that merges unrelated ones). "enforce" (the
  # default) declines it, "observe" adds it as before but logs it, "off"
  # skips the checks. Each decision is logged as "scope decision".
  # scope_vetoes: enforce
  bruteforce:
    enabled: false
    wordlists: # wordlist(s) to use that are specific to brute forcing
      - "./wordlists/short-wordlist.txt"
      #- "./wordlists/subdomains-top1mil-5000.txt"
      #- "./wordlists/subdomains-top1mil-20000.txt"
      #- "./wordlists/subdomains-top1mil-110000.txt"
  alterations:
    enabled: false
    wordlists: # wordlist(s) to use that are specific to name alterations
      - "./wordlists/alterations.txt"
  default_transform_values:
    ttl: 1440 # minutes. If not specified, the default is 1440 minutes (1 day)
    confidence: 50 # 50%
    priority: 5

transformations:
  Account->ALL:
    ttl: 10800 # 7 days
  AutnumRecord->ALL:
  AutonomousSystem->ALL:
  AutonomousSystem->RDAP:
    ttl: 43200 # 30 days
  ContactRecord->ALL:
  DomainRecord->ALL:
  File->ALL:
  FQDN->ALL:
  FQDN->DomainRecord:
    ttl: 43200 # 30 days
  FundsTransfer->ALL:
    ttl: 10800 # 7 days
  Identifier->ALL:
  Identifier->GLEIF:
    ttl: 43200 # 30 days
  Identifier->RDAP:
    ttl: 43200 # 30 days
  IPAddress->ALL:
  IPNetRecord->ALL:
  Location->ALL:
  Netblock->ALL:
  Netblock->RDAP:
    ttl: 43200 # 30 days
  Organization->ALL:
  Organization->GLEIF:
    ttl: 43200 # 30 days
  Person->ALL:
    ttl: 43200 # 30 days
  Phone->ALL:
    ttl: 10800 # 7 days
  Product->ALL:
    ttl: 10800 # 7 days
  ProductRelease->ALL:
  Service->ALL:
  TLSCertificate->ALL:
    ttl: 10800 # 7 days
  URL->ALL:
